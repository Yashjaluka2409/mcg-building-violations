# docker compose -f sandbox/docker-compose.yml up -d --build   -> http://<server>:8000/building-violations/
services:
  bvms:
    build: { context: .., dockerfile: sandbox/Dockerfile }
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql://bvms:bvms@db:5432/bvms      # asyncpg is used automatically
      PUBLIC_VERIFY_BASE: https://sandbox.example.gov.in/building-violations/verify
      SECRET_KEY: change-me
    volumes: ["bvms-data:/data"]
    depends_on: [db]
  db:
    image: postgis/postgis:16-3.4
    environment: { POSTGRES_USER: bvms, POSTGRES_PASSWORD: bvms, POSTGRES_DB: bvms }
    volumes: ["bvms-db:/var/lib/postgresql/data"]
volumes: { bvms-data: {}, bvms-db: {} }
