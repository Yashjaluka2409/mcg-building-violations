    get:
      operationId: building_violations_api_masters_violation_types_list
      parameters:
      - in: query
        name: action_path
        schema:
          type: string
      - in: query
        name: active
        schema:
          type: boolean
      - in: query
        name: category
        schema:
          type: string
          enum:
          - DANGEROUS_UNFIT
          - DEVIATION_FROM_SANCTION
          - GOVT_LAND
          - MISUSE_CHANGE_OF_USE
          - PRIVATE_LAND_NO_SANCTION
          - PROCEDURAL_NON_COMPLIANCE
          - STREET_ENCROACHMENT
        description: |-
          * `GOVT_LAND` - Government / Corporation land
          * `PRIVATE_LAND_NO_SANCTION` - Private land - no sanction
          * `DEVIATION_FROM_SANCTION` - Deviation from sanction
          * `STREET_ENCROACHMENT` - Street encroachment
          * `MISUSE_CHANGE_OF_USE` - Misuse / change of use
          * `DANGEROUS_UNFIT` - Dangerous / unfit
          * `PROCEDURAL_NON_COMPLIANCE` - Non-compliance with orders
      - in: query
        name: compoundable
        schema:
          type: string
      - name: ordering
        required: false
        in: query
