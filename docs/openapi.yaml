  /building-violations/api/media/:
    get:
      operationId: building_violations_api_media_list
      description: |-
        POST multipart {file, kind, case?, latitude, longitude, accuracy_m, captured_at, device_id, caption}.
        The mobile app captures photos/videos in-app and posts the GPS fix read at capture time; the server
        stores the fix, hashes the file and (when a case is given) computes the distance to the case point.
      parameters:
      - in: query
        name: case
        schema:
          type: string
          format: uuid
      - in: query
        name: kind
        schema:
          type: string
          enum:
          - APPEAL
          - COMPLIANCE
          - EXECUTION
          - HEARING
          - INSPECTION
          - NOTICE_DELIVERY
          - ORDER_DELIVERY
          - OTHER
          - RESPONSE
          - SANCTION_DOC
        description: |-
          * `INSPECTION` - Inspection evidence
          * `NOTICE_DELIVERY` - Proof of delivery of notice
          * `ORDER_DELIVERY` - Proof of delivery of order
          * `RESPONSE` - Response / reply document
          * `HEARING` - Hearing record
          * `EXECUTION` - Demolition / sealing evidence
          * `COMPLIANCE` - Self-compliance evidence
          * `APPEAL` - Appeal / court order
          * `SANCTION_DOC` - Sanction / licence document
          * `OTHER` - Other
      - in: query
        name: notice
        schema:
          type: string
          format: uuid
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: sanctioned_plan
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - building-violations
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMediaAttachmentList'
          description: ''
    post:
      operationId: building_violations_api_media_create
      description: |-
        POST multipart {file, kind, case?, latitude, longitude, accuracy_m, captured_at, device_id, caption}.
        The mobile app captures photos/videos in-app and posts the GPS fix read at capture time; the server
        stores the fix, hashes the file and (when a case is given) computes the distance to the case point.
      tags:
      - building-violations
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MediaAttachment'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MediaAttachment'
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaAttachment'
          description: ''
