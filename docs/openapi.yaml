components:
  schemas:
    ActionEnum:
      enum:
      - DEMOLITION
      - PARTIAL_DEMOLITION
      - SEALING
      - DESEALING
      - EVICTION
      - REMOVAL
      - ALTERATION
      type: string
      description: |-
        * `DEMOLITION` - Demolition
        * `PARTIAL_DEMOLITION` - Partial demolition
        * `SEALING` - Sealing
        * `DESEALING` - De-sealing
        * `EVICTION` - Eviction / possession taken
        * `REMOVAL` - Removal of encroachment
        * `ALTERATION` - Alteration carried out
    AgencyEnum:
      enum:
      - MCG
      - HSVP
      - GMDA
      - STATE_GOVT
      - PWD
      - IRRIGATION
      - FOREST
      - PANCHAYAT
      - RAILWAYS
      - NHAI
      - DEFENCE
      - OTHER
      type: string
      description: |-
        * `MCG` - Municipal Corporation Gurugram
        * `HSVP` - Haryana Shahari Vikas Pradhikaran
        * `GMDA` - Gurugram Metropolitan Development Authority
        * `STATE_GOVT` - State Government (other departments)
        * `PWD` - PWD (B&R)
        * `IRRIGATION` - Irrigation & Water Resources
        * `FOREST` - Forest Department
        * `PANCHAYAT` - Gram Panchayat / Shamlat Deh
        * `RAILWAYS` - Railways
        * `NHAI` - NHAI
        * `DEFENCE` - Defence
        * `OTHER` - Other
    Appeal:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        recorded_by:
          allOf:
          - $ref: '#/components/schemas/UserLite'
          readOnly: true
        authority_display:
          type: string
          readOnly: true
        status_display:
          type: string
          readOnly: true
        stay_order:
          allOf:
          - $ref: '#/components/schemas/MediaAttachment'
          readOnly: true
        final_order:
          allOf:
          - $ref: '#/components/schemas/MediaAttachment'
          readOnly: true
        is_stay_active:
          type: boolean
          readOnly: true
        order_no:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        authority:
          $ref: '#/components/schemas/AuthorityEnum'
        authority_other:
          type: string
          maxLength: 200
        filed_on:
          type: string
          format: date
        appeal_no:
          type: string
          description: Appeal / CWP / SLP / OA number
          maxLength: 120
        appellant_name:
          type: string
          maxLength: 200
        counsel_for_mcg:
          type: string
          maxLength: 200
        status:
          $ref: '#/components/schemas/AppealStatusEnum'
        stay_granted:
          type: boolean
        stay_order_date:
          type: string
          format: date
          nullable: true
        stay_until:
          type: string
          format: date
          nullable: true
          description: Blank = until further orders / next date
        stay_scope:
          oneOf:
          - $ref: '#/components/schemas/StayScopeEnum'
          - $ref: '#/components/schemas/BlankEnum'
        conditions:
          type: string
        next_hearing_on:
          type: string
          format: date
          nullable: true
        decided_on:
          type: string
          format: date
          nullable: true
        decision_summary:
          type: string
        case:
          type: string
          format: uuid
        order:
          type: string
          format: uuid
          nullable: true
      required:
      - authority
      - authority_display
      - case
      - created_at
      - filed_on
      - final_order
      - id
      - is_stay_active
      - order_no
      - recorded_by
      - status_display
      - stay_order
      - updated_at
    AppealStatusEnum:
      enum:
      - PENDING
      - STAYED
      - STAY_VACATED
      - DISMISSED
      - ALLOWED
      - MODIFIED
      - WITHDRAWN
      - DISPOSED
      type: string
      description: |-
        * `PENDING` - Pending - no stay
        * `STAYED` - Stay / status quo granted
        * `STAY_VACATED` - Stay vacated
        * `DISMISSED` - Dismissed
        * `ALLOWED` - Allowed (order set aside)
        * `MODIFIED` - Order modified
        * `WITHDRAWN` - Withdrawn
        * `DISPOSED` - Disposed with directions
    AuthorityEnum:
      enum:
      - DIVISIONAL_COMMISSIONER
      - COMMISSIONER_MCG
      - CIVIL_COURT
      - HIGH_COURT
      - SUPREME_COURT
      - NGT
      - OTHER
      type: string
      description: |-
        * `DIVISIONAL_COMMISSIONER` - Divisional Commissioner, Gurugram (s.261(2) / s.263A(4))
        * `COMMISSIONER_MCG` - Commissioner, MCG (s.408B)
        * `CIVIL_COURT` - Civil Court / District Court
        * `HIGH_COURT` - Punjab & Haryana High Court
        * `SUPREME_COURT` - Supreme Court of India
        * `NGT` - National Green Tribunal
        * `OTHER` - Other forum
    BlankEnum:
      enum:
      - ''
    Branch:
      type: object
      properties:
        code:
          type: string
          maxLength: 20
        name_en:
          type: string
          maxLength: 120
        name_hi:
          type: string
          maxLength: 120
        description:
          type: string
        head_designation:
          type: string
          maxLength: 120
        default_response_days:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        active:
          type: boolean
        officers:
          type: string
          readOnly: true
      required:
      - code
      - name_en
      - officers
    BranchReferral:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        case:
          type: string
          format: uuid
        case_no:
          type: string
          readOnly: true
        case_status:
          type: string
          readOnly: true
        case_address:
          type: string
          readOnly: true
        ward_number:
          type: integer
          readOnly: true
        branch:
          allOf:
          - $ref: '#/components/schemas/Branch'
          readOnly: true
        referred_by:
          allOf:
          - $ref: '#/components/schemas/UserLite'
          readOnly: true
        referred_at:
          type: string
          format: date-time
        query:
          type: string
          description: What the branch is asked to examine / report on
        due_at:
          type: string
          format: date-time
          nullable: true
        hold_case:
          type: boolean
          description: If true, final orders are blocked until the branch responds
            (subject to workflow setting)
        status:
          $ref: '#/components/schemas/BranchReferralStatusEnum'
        assigned_to:
          allOf:
          - $ref: '#/components/schemas/UserLite'
          readOnly: true
        response:
          type: string
        recommendation:
          type: string
          maxLength: 40
        responded_by:
          allOf:
          - $ref: '#/components/schemas/UserLite'
          readOnly: true
        responded_at:
          type: string
          format: date-time
          nullable: true
        closed_by:
          allOf:
          - $ref: '#/components/schemas/UserLite'
          readOnly: true
        closed_at:
          type: string
          format: date-time
          nullable: true
        closing_remarks:
          type: string
        is_overdue:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - assigned_to
      - branch
      - case
      - case_address
      - case_no
      - case_status
      - closed_by
      - created_at
      - id
      - is_overdue
      - query
      - referred_by
      - responded_by
      - ward_number
    BranchReferralStatusEnum:
      enum:
      - PENDING
      - RESPONDED
      - CLOSED
      - WITHDRAWN
      type: string
      description: |-
        * `PENDING` - Awaiting branch response
        * `RESPONDED` - Response received
        * `CLOSED` - Closed by referring officer
        * `WITHDRAWN` - Withdrawn
    CaseCreate:
      type: object
      properties:
        source:
          type: string
          default: FIELD_INSPECTION
        complaint_ref:
          type: string
        priority:
          allOf:
          - $ref: '#/components/schemas/PriorityEnum'
          default: NORMAL
        pid:
          type: string
        pid_snapshot: {}
        pid_linked_mobile:
          type: string
        alternate_mobile:
          type: string
        address_line:
          type: string
        locality:
          type: string
        sector:
          type: string
        village_colony:
          type: string
        pincode:
          type: string
        ward:
          type: integer
          nullable: true
        zone:
          type: integer
          nullable: true
        division:
          type: integer
          nullable: true
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,7})?$
          nullable: true
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,7})?$
          nullable: true
        location_accuracy_m:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
          nullable: true
        land_type:
          allOf:
          - $ref: '#/components/schemas/LandTypeEnum'
          default: UNKNOWN
        sanctioned_plan:
          type: integer
          nullable: true
        owner_name:
          type: string
        owner_father_name:
          type: string
        occupier_name:
          type: string
        builder_name:
          type: string
        person_on_site:
          type: string
        construction_stage:
          allOf:
          - $ref: '#/components/schemas/ConstructionStageEnum'
          default: UNDER_CONSTRUCTION
        plot_area_sqm:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
        covered_area_sqm:
          type: string
          format: decimal
