        * `SANCTION_FOLLOWUP` - Sanctioned plan follow-up (DPC / completion)
        * `GOVT_LAND` - Government land watch
        * `RE_INSPECTION` - Re-inspection of an existing case
        * `OTHER` - Other
    InspectionTaskStatusEnum:
      enum:
      - ASSIGNED
      - UNASSIGNED
      - IN_PROGRESS
      - VIOLATION_RECORDED
      - NO_VIOLATION
      - NOT_FOUND
      - CANCELLED
      type: string
      description: |-
        * `ASSIGNED` - Assigned
        * `UNASSIGNED` - Awaiting assignment
        * `IN_PROGRESS` - Inspection started on site
        * `VIOLATION_RECORDED` - Violation recorded (case created)
        * `NO_VIOLATION` - Inspected - no violation
        * `NOT_FOUND` - Property not traceable
        * `CANCELLED` - Cancelled
    KindEnum:
      enum:
      - INSPECTION
      - NOTICE_DELIVERY
      - ORDER_DELIVERY
      - RESPONSE
      - HEARING
      - EXECUTION
      - COMPLIANCE
      - APPEAL
      - STAY_ORDER
      - COURT_ORDER
      - SANCTION_DOC
      - TASK_EVIDENCE
      - BRANCH_REFERRAL
      - BRANCH_RESPONSE
      - OTHER
      type: string
      description: |-
        * `INSPECTION` - Inspection evidence
        * `NOTICE_DELIVERY` - Proof of delivery of notice
        * `ORDER_DELIVERY` - Proof of delivery of order
        * `RESPONSE` - Response / reply document
        * `HEARING` - Hearing record
        * `EXECUTION` - Demolition / sealing evidence
        * `COMPLIANCE` - Self-compliance evidence
        * `APPEAL` - Appeal memo / pleadings
        * `STAY_ORDER` - Stay / interim order of the appellate authority or court
        * `COURT_ORDER` - Final order / judgment
        * `SANCTION_DOC` - Sanction / licence document
        * `TASK_EVIDENCE` - Planned-inspection evidence (no violation / not found)
        * `BRANCH_REFERRAL` - Document sent with a branch referral
        * `BRANCH_RESPONSE` - Branch response / report
        * `OTHER` - Other
