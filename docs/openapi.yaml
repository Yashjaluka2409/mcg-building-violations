        * `BULK_UPLOAD` - Excel/CSV upload
        * `PLATFORM_SYNC` - Synced from MCG building-plan module
    Status181Enum:
      enum:
      - DRAFT
      - PENDING_AE
      - RETURNED_TO_JE
      - PENDING_JC
      - SCN_ISSUED
      - SCN_SERVED
      - RESPONSE_RECEIVED
      - RESPONSE_PENDING_AE
      - RESPONSE_PENDING_JC
      - NO_RESPONSE
      - HEARING_SCHEDULED
      - ORDER_ISSUED
      - ORDER_SERVED
      - APPEAL_STAY
      - EXECUTION_DUE
      - COMPLIED
      - EXECUTED
      - CLOSED
      - DROPPED
      - REGULARISED
      type: string
      description: |-
        * `DRAFT` - Draft (JE)
        * `PENDING_AE` - Pending with AE
        * `RETURNED_TO_JE` - Returned to JE for re-inspection
        * `PENDING_JC` - Pending with JC
        * `SCN_ISSUED` - Show cause notice issued
        * `SCN_SERVED` - SCN served - response awaited
        * `RESPONSE_RECEIVED` - Response received
        * `RESPONSE_PENDING_AE` - Response with AE for comments
        * `RESPONSE_PENDING_JC` - Response with JC for decision
        * `NO_RESPONSE` - No response within time
        * `HEARING_SCHEDULED` - Hearing scheduled
        * `ORDER_ISSUED` - Final order issued
        * `ORDER_SERVED` - Order served - compliance period running
        * `APPEAL_STAY` - Stayed in appeal
        * `EXECUTION_DUE` - Compliance period over - execution due
        * `COMPLIED` - Complied by owner
        * `EXECUTED` - Demolished / sealed by MCG
        * `CLOSED` - Closed
        * `DROPPED` - Dropped - no violation
        * `REGULARISED` - Regularised / compounded
    StayScopeEnum:
      enum:
      - FULL
      - DEMOLITION_ONLY
      - STATUS_QUO
      - PARTIAL
      type: string
      description: |-
        * `FULL` - All action stayed
        * `DEMOLITION_ONLY` - Demolition stayed (sealing / stop-work continue)
        * `STATUS_QUO` - Status quo (no construction, no demolition)
        * `PARTIAL` - Partial - see conditions
