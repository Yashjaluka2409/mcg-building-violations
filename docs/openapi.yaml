  /building-violations/api/gis/govt-land/:
    get:
      operationId: building_violations_api_gis_govt_land_list
      parameters:
      - in: query
        name: active
        schema:
          type: boolean
      - in: query
        name: agency
        schema:
          type: string
          enum:
          - DEFENCE
          - FOREST
          - GMDA
          - HSVP
          - IRRIGATION
          - MCG
          - NHAI
          - OTHER
          - PANCHAYAT
          - PWD
          - RAILWAYS
          - STATE_GOVT
        description: |-
          * `MCG` - Municipal Corporation Gurugram
          * `HSVP` - Haryana Shahari Vikas Pradhikaran
          * `GMDA` - Gurugram Metropolitan Development Authority
          * `STATE_GOVT` - State Government (other departments)
          * `PWD` - PWD (B&R)
          * `IRRIGATION` - Irrigation & Water Resources
          * `FOREST` - Forest Department
          * `PANCHAYAT` - Gram Panchayat / Shamlat Deh
          * `RAILWAYS` - Railways
          * `NHAI` - NHAI
          * `DEFENCE` - Defence
          * `OTHER` - Other
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: village
        schema:
          type: string
      - in: query
        name: ward
        schema:
          type: integer
      tags:
      - building-violations
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedGovtLandParcelList'
          description: ''
    post:
      operationId: building_violations_api_gis_govt_land_create
      tags:
      - building-violations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GovtLandParcel'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GovtLandParcel'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GovtLandParcel'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GovtLandParcel'
          description: ''
