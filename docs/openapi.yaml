          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
          description: ''
    delete:
      operationId: building_violations_api_branches_destroy
      parameters:
      - in: path
        name: code
        schema:
          type: string
        description: A unique value identifying this branch.
        required: true
      tags:
      - building-violations
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
