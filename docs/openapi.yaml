          maxLength: 200
        police_assistance:
          type: boolean
        police_station:
          type: string
          maxLength: 120
        duty_magistrate:
          type: string
          maxLength: 200
        machinery_used:
          type: string
          maxLength: 300
        area_demolished_sqm:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
        seal_memo_no:
          type: string
