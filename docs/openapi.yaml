components:
  schemas:
    ActionEnum:
      enum:
      - DEMOLITION
      - PARTIAL_DEMOLITION
      - SEALING
      - DESEALING
      - EVICTION
      - REMOVAL
      - ALTERATION
      type: string
      description: |-
        * `DEMOLITION` - Demolition
        * `PARTIAL_DEMOLITION` - Partial demolition
        * `SEALING` - Sealing
        * `DESEALING` - De-sealing
        * `EVICTION` - Eviction / possession taken
        * `REMOVAL` - Removal of encroachment
        * `ALTERATION` - Alteration carried out
    AgencyEnum:
      enum:
      - MCG
      - HSVP
      - GMDA
      - STATE_GOVT
      - PWD
      - IRRIGATION
      - FOREST
      - PANCHAYAT
      - RAILWAYS
      - NHAI
      - DEFENCE
      - OTHER
      type: string
      description: |-
        * `MCG` - Municipal Corporation Gurugram
        * `HSVP` - Haryana Shahari Vikas Pradhikaran
        * `GMDA` - Gurugram Metropolitan Development Authority
        * `STATE_GOVT` - State Government (other departments)
        * `PWD` - PWD (B&R)
        * `IRRIGATION` - Irrigation & Water Resources
        * `FOREST` - Forest Department
        * `PANCHAYAT` - Gram Panchayat / Shamlat Deh
        * `RAILWAYS` - Railways
        * `NHAI` - NHAI
        * `DEFENCE` - Defence
        * `OTHER` - Other
    Appeal:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        recorded_by:
          allOf:
          - $ref: '#/components/schemas/UserLite'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        filed_on:
          type: string
          format: date
        authority:
          type: string
          maxLength: 200
        appeal_no:
          type: string
          maxLength: 80
        status:
          type: string
          maxLength: 16
        stay_granted:
          type: boolean
        stay_until:
          type: string
          format: date
          nullable: true
        conditions:
          type: string
        decided_on:
          type: string
          format: date
          nullable: true
        decision_summary:
          type: string
        case:
          type: string
          format: uuid
        order:
          type: string
          format: uuid
          nullable: true
      required:
      - authority
      - case
      - created_at
      - filed_on
      - id
      - recorded_by
      - updated_at
    BlankEnum:
      enum:
      - ''
    CaseCreate:
      type: object
      properties:
        source:
          type: string
          default: FIELD_INSPECTION
        complaint_ref:
          type: string
        priority:
          allOf:
          - $ref: '#/components/schemas/PriorityEnum'
          default: NORMAL
        pid:
          type: string
        pid_snapshot: {}
        pid_linked_mobile:
          type: string
        alternate_mobile:
          type: string
        address_line:
          type: string
        locality:
          type: string
        sector:
          type: string
        village_colony:
          type: string
        pincode:
          type: string
        ward:
          type: integer
          nullable: true
        zone:
          type: integer
          nullable: true
        division:
          type: integer
          nullable: true
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,7})?$
          nullable: true
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,7})?$
          nullable: true
        location_accuracy_m:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
          nullable: true
        land_type:
          allOf:
          - $ref: '#/components/schemas/LandTypeEnum'
          default: UNKNOWN
        sanctioned_plan:
          type: integer
          nullable: true
        owner_name:
          type: string
        owner_father_name:
          type: string
        occupier_name:
          type: string
        builder_name:
          type: string
        person_on_site:
          type: string
        construction_stage:
          allOf:
          - $ref: '#/components/schemas/ConstructionStageEnum'
          default: UNDER_CONSTRUCTION
        plot_area_sqm:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
        covered_area_sqm:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
        storeys:
          type: string
        height_m:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
          nullable: true
        use_observed:
          type: string
        description:
          type: string
        measurements: {}
        inspected_at:
          type: string
          format: date-time
        violations:
          type: array
          items:
            $ref: '#/components/schemas/CaseViolationInput'
        media_ids:
          type: array
          items:
            type: string
            format: uuid
        submit:
          type: boolean
          default: false
      required:
      - address_line
      - description
      - violations
    CaseEvent:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        at:
          type: string
          format: date-time
        actor:
          allOf:
          - $ref: '#/components/schemas/UserLite'
          readOnly: true
        actor_role:
          type: string
          maxLength: 24
        action:
          type: string
          maxLength: 40
        from_status:
          type: string
          maxLength: 30
        to_status:
          type: string
          maxLength: 30
        remarks:
          type: string
        payload: {}
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,7})?$
          nullable: true
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,7})?$
          nullable: true
        hash:
          type: string
          maxLength: 64
        prev_hash:
          type: string
          maxLength: 64
      required:
      - action
      - actor
      - id
    CaseResponse:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        uploaded_by:
          allOf:
          - $ref: '#/components/schemas/UserLite'
          readOnly: true
        notice_no:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        received_on:
          type: string
          format: date
        received_via:
          $ref: '#/components/schemas/ReceivedViaEnum'
        submitted_by_name:
          type: string
          maxLength: 200
        summary:
          type: string
        requests_hearing:
          type: boolean
        is_within_time:
          type: boolean
        ae_comments:
          type: string
        ae_commented_at:
          type: string
          format: date-time
          nullable: true
        jc_remarks:
          type: string
        case:
          type: string
          format: uuid
        notice:
          type: string
          format: uuid
          nullable: true
      required:
      - case
      - created_at
      - id
      - notice_no
      - received_on
      - received_via
      - summary
      - updated_at
      - uploaded_by
    CaseViolation:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        code:
          type: string
          readOnly: true
        violation_type:
          allOf:
          - $ref: '#/components/schemas/ViolationType'
          readOnly: true
        details:
          description: permitted / actual measurements, floors etc.
        remarks:
          type: string
        is_primary:
          type: boolean
      required:
      - code
      - id
      - violation_type
    CaseViolationInput:
      type: object
      properties:
        code:
          type: string
        details: {}
        remarks:
          type: string
        is_primary:
          type: boolean
          default: false
      required:
      - code
    CategoryEnum:
      enum:
      - GOVT_LAND
      - PRIVATE_LAND_NO_SANCTION
      - DEVIATION_FROM_SANCTION
      - STREET_ENCROACHMENT
      - MISUSE_CHANGE_OF_USE
      - DANGEROUS_UNFIT
      - PROCEDURAL_NON_COMPLIANCE
      type: string
      description: |-
        * `GOVT_LAND` - Government / Corporation land
        * `PRIVATE_LAND_NO_SANCTION` - Private land - no sanction
        * `DEVIATION_FROM_SANCTION` - Deviation from sanction
        * `STREET_ENCROACHMENT` - Street encroachment
        * `MISUSE_CHANGE_OF_USE` - Misuse / change of use
        * `DANGEROUS_UNFIT` - Dangerous / unfit
        * `PROCEDURAL_NON_COMPLIANCE` - Non-compliance with orders
    ConstructionStageEnum:
      enum:
      - PLINTH
      - UNDER_CONSTRUCTION
      - COMPLETED
      - OCCUPIED
      type: string
      description: |-
        * `PLINTH` - Plinth / foundation
        * `UNDER_CONSTRUCTION` - Under construction
        * `COMPLETED` - Completed
        * `OCCUPIED` - Completed and occupied
    CurrentOwnerRoleEnum:
      enum:
      - JE
      - AE
      - XEN
      - JC
      - JC_CLERK
      - ADDL_COMMISSIONER
      - COMMISSIONER
      - FIELD_STAFF
      - ADMIN
      - VIEWER
      type: string
      description: |-
        * `JE` - Junior Engineer (field)
        * `AE` - Assistant Engineer
        * `XEN` - Executive Engineer
        * `JC` - Joint Commissioner
        * `JC_CLERK` - JC office clerk (response upload only)
        * `ADDL_COMMISSIONER` - Additional Commissioner
        * `COMMISSIONER` - Commissioner
        * `FIELD_STAFF` - Enforcement / demolition squad
        * `ADMIN` - Module administrator
        * `VIEWER` - Read-only (MIS)
    Division:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        code:
          type: string
          maxLength: 10
        zone:
          type: integer
        name_en:
          type: string
          maxLength: 80
        active:
          type: boolean
      required:
      - code
      - id
      - zone
    ExecutionRecord:
