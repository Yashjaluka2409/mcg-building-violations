openapi: 3.0.3
info:
  title: MCG Building Violation Management System API
  version: 1.0.0
  description: REST API consumed by the MCG web portal module and the MCG HARYANA
    mobile app (building-violations module).
paths:
  /building-violations/api/admin/audit-log/:
    get:
      operationId: building_violations_api_admin_audit_log_retrieve
      tags:
      - building-violations
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /building-violations/api/admin/permissions/:
    get:
      operationId: building_violations_api_admin_permissions_retrieve
      description: 'GET -> catalogue + role matrix; PUT {"grants": [{"role","permission","allowed"}],
        "order_reference"}'
      tags:
      - building-violations
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
    put:
      operationId: building_violations_api_admin_permissions_update
      description: 'GET -> catalogue + role matrix; PUT {"grants": [{"role","permission","allowed"}],
        "order_reference"}'
      tags:
      - building-violations
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /building-violations/api/admin/reassign-cases/:
    post:
      operationId: building_violations_api_admin_reassign_cases_create
      description: Re-assign many cases at once when jurisdictions change (by explicit
        ids, or by zone / ward / current officer).
      tags:
      - building-violations
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /building-violations/api/admin/settings/:
    get:
      operationId: building_violations_api_admin_settings_retrieve
      tags:
      - building-violations
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
    put:
      operationId: building_violations_api_admin_settings_update
      tags:
      - building-violations
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /building-violations/api/admin/workflow-rules/:
    get:
      operationId: building_violations_api_admin_workflow_rules_retrieve
      description: |-
        GET -> {statuses, roles, actions, labels, matrix: {status: {role: [actions]}}}
        PUT -> {"rules": [{"status","role","action","allowed"}...], "order_reference": "..."} (partial: only listed rules change)
        POST reset -> reseed defaults
      tags:
      - building-violations
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
    post:
      operationId: building_violations_api_admin_workflow_rules_create
      description: |-
        GET -> {statuses, roles, actions, labels, matrix: {status: {role: [actions]}}}
        PUT -> {"rules": [{"status","role","action","allowed"}...], "order_reference": "..."} (partial: only listed rules change)
        POST reset -> reseed defaults
      tags:
      - building-violations
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
    put:
      operationId: building_violations_api_admin_workflow_rules_update
      description: |-
        GET -> {statuses, roles, actions, labels, matrix: {status: {role: [actions]}}}
        PUT -> {"rules": [{"status","role","action","allowed"}...], "order_reference": "..."} (partial: only listed rules change)
        POST reset -> reseed defaults
      tags:
      - building-violations
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
